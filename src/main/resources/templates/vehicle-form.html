<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Hirdetés feladása</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
        :root { --bg: #f4f6f8; --card: #ffffff; --accent: #e60000; --text: #19202a; --muted: #667085; --border: #e3e8ef; }
        body { margin: 0; font-family: Roboto, sans-serif; background: var(--bg); color: var(--text); }
        .container { max-width: 900px; margin: 24px auto 40px; padding: 0 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 24px rgba(31,41,51,.06); }
        h1 { margin-top: 0; }
        .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        label { font-size: 13px; color: var(--muted); }
        input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; box-sizing: border-box; }
        .actions { display: flex; gap: 10px; margin-top: 16px; }
        .btn { background: var(--accent); color: white; border: none; border-radius: 12px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
        .btn.secondary { background: #fff; border: 1px solid var(--border); color: var(--text); text-decoration: none; }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
        .features label { display: flex; align-items: center; gap: 8px; color: var(--text); }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Hirdetés feladása</h1>
        <form method="post" action="/vehicles/save" th:object="${vehicleForm}" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{imgUrl}" />
            <div class="grid">
                <div><label>Név</label><input type="text" th:field="*{name}" required /></div>
                <div><label>Márka</label><input type="text" th:field="*{brand}" required /></div>
                <div><label>Rendszám</label><input type="text" th:field="*{plateNumber}" required /></div>
                <div>
                    <label>Típus</label>
                    <select th:field="*{type}" required>
                        <option value="">Válassz</option>
                        <option value="GK">GK - Személyautó</option>
                        <option value="TGK">TGK - Tehergépkocsi</option>
                        <option value="MOTOR">MOTOR - Motor</option>
                    </select>
                </div>
                <div>
                    <label>Fotó</label>
                    <input type="file" name="imageFile" accept="image/*" />
                    <img th:if="*{imgUrl}" th:src="*{imgUrl}" alt="Jarmu foto" style="margin-top:8px; max-width:160px; border-radius:8px; border:1px solid var(--border);" />
                </div>
                <div><label>Futás (km)</label><input type="number" th:field="*{km}" required /></div>
                <div><label>Évjárat</label><input type="number" th:field="*{yearOfManufacture}" required /></div>
                <div><label>Szín</label><input type="text" th:field="*{color}" required /></div>
                <div><label>Ár (Ft)</label><input type="number" th:field="*{price}" required /></div>
                <div>
                    <label>Üzemanyag</label>
                    <select th:field="*{fuel}" required>
                        <option value="">Válassz</option>
                        <option value="benzin">Benzin</option>
                        <option value="dízel">Dízel</option>
                        <option value="elektromos">Elektromos</option>
                        <option value="lpg">LPG</option>
                    </select>
                </div>
                <div>
                    <label>Állapot</label>
                    <select th:field="*{conditionStatus}" required>
                        <option value="">Válassz</option>
                        <option value="használt">Használt</option>
                        <option value="újszerű">Újszerű</option>
                        <option value="felújítandó">Felújítandó</option>
                    </select>
                </div>
            </div>
            <div style="margin-top:16px"><label>Leírás</label><textarea rows="4" th:field="*{description}"></textarea></div>
            <div style="margin-top:16px">
                <label>Extrák</label>
                <div class="features">
                    <label th:each="feature : ${features}">
                        <input type="checkbox" name="featureIds" th:value="${feature.id}" th:checked="${vehicleForm.featureIds.contains(feature.id)}" />
                        <span th:text="${feature.name}">Klíma</span>
                    </label>
                </div>
            </div>
            <div class="actions">
                <button class="btn" type="submit">Hirdetés feladása</button>
                <a class="btn secondary" href="/">Mégse</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
