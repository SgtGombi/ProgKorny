<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <title>Hozzáférés megtagadva</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; font-family: Roboto, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; border: 1px solid #e3e8ef; border-radius: 16px; padding: 40px; max-width: 420px; text-align: center; box-shadow: 0 10px 24px rgba(31,41,51,.08); }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { margin: 0 0 8px; font-size: 22px; color: #19202a; }
        p { color: #667085; margin: 0 0 24px; }
        a { display: inline-block; background: #e60000; color: white; text-decoration: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🚫</div>
    <h1>Hozzáférés megtagadva</h1>
    <p>Ehhez az oldalhoz nincs jogosultságod.</p>
    <a href="/">Vissza a főoldalra</a>
</div>
</body>
</html>
